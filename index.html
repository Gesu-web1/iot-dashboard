<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT Multisensor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1100px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0056b3; }
        .grid-dashboards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-chart { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .status { font-weight: bold; color: #28a745; }
        .temp-title { color: #dc3545; }
        .hum-title { color: #007bff; }
        .gas-title { color: #fd7e14; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Control IoT - Multi-Sensor</h1>
        <p>Estado del Sistema: <span id="status-text" class="status">Monitoreando...</span></p>
        
        <div class="grid-dashboards">
            <div class="card-chart">
                <h3 class="temp-title">🌡️ Sensor de Temperatura</h3>
                <div class="chart-container"><canvas id="chart-temperatura"></canvas></div>
            </div>

            <div class="card-chart">
                <h3 class="hum-title">💧 Sensor de Humedad</h3>
                <div class="chart-container"><canvas id="chart-humedad"></canvas></div>
            </div>

            <div class="card-chart">
                <h3 class="gas-title">💨 Sensor de Gas (CO2)</h3>
                <div class="chart-container"><canvas id="chart-co2"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://iot-backend-i749.onrender.com/api/sensores';

        // Función auxiliar para crear la configuración de cada gráfico rápidamente
        function crearConfigGrafico(label, colorBg, colorBorder) {
            return {
                type: 'line',
                data: { labels: [], datasets: [{ label: label, data: [], borderColor: colorBorder, backgroundColor: colorBg, borderWidth: 2, tension: 0.2, fill: true }] },
                options: { responsive: true, maintainAspectRatio: false }
            };
        }

        // Inicializamos los 3 gráficos independientes
        const chartTemp = new Chart(document.getElementById('chart-temperatura').getContext('2d'), crearConfigGrafico('Grados °C', 'rgba(220, 53, 69, 0.1)', '#dc3545'));
        const chartHum = new Chart(document.getElementById('chart-humedad').getContext('2d'), crearConfigGrafico('Porcentaje %', 'rgba(0, 123, 255, 0.1)', '#007bff'));
        const chartCo2 = new Chart(document.getElementById('chart-co2').getContext('2d'), crearConfigGrafico('Partes por millón (ppm)', 'rgba(253, 126, 20, 0.1)', '#fd7e14'));

        // Función para actualizar un gráfico específico consultando su endpoint correspondiente
        // Función para actualizar un gráfico específico consultando su endpoint correspondiente
        async function actualizarGrafico(tipoSensor, objetoGrafico) {
            try {
                const response = await fetch(`${BASE_URL}/${tipoSensor}`);
                if (!response.ok) throw new Error();
                const datos = await response.json();
                
                objetoGrafico.data.labels = datos.map(item => new Date(item.fecha_registro).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                objetoGrafico.data.datasets[0].data = datos.map(item => item.sensor_valor);
                objetoGrafico.update();
        
                // Si llega aquí, al menos este sensor cargó bien; reseteamos el mensaje de error
                const statusText = document.getElementById('status-text');
                statusText.innerText = "Online (Actualizado)";
                statusText.style.color = "#28a745";
            } catch (e) {
                const statusText = document.getElementById('status-text');
                statusText.innerText = "Error al leer sensores";
                statusText.style.color = "#dc3545";
            }
        }

        function actualizarTodo() {
            actualizarGrafico('temperatura', chartTemp);
            actualizarGrafico('humedad', chartHum);
            actualizarGrafico('co2', chartCo2);
        }

        // Consultar los dashboards en paralelo cada 1 segundo (1000 milisegundos)
        setInterval(actualizarTodo, 1000);
        actualizarTodo();
    </script>
</body>
</html>
