<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT - Monitoreo de Sensores</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #0056b3; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 30px; }
        .chart-container { position: relative; height: 450px; width: 100%; }
        .status { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Control IoT</h1>
        <p>Estado del Servidor: <span id="status-text" class="status">Conectando...</span></p>
        
        <div class="chart-container">
            <canvas id="sensorChart"></canvas>
        </div>
    </div>

    <script>
        // TODO: REEMPLAZA ESTA URL CON LA QUE TE DE RENDER AL DESPLEGAR
        const API_URL = 'https://iot-backend-i749.onrender.com/api/sensores';

        const ctx = document.getElementById('sensorChart').getContext('2d');
        
        // Inicialización del Gráfico de Líneas
        const sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Lecturas del Sensor',
                    data: [],
                    borderColor: '#007bff',
                    backgroundColor: 'rgba(0, 123, 255, 0.1)',
                    borderWidth: 3,
                    pointRadius: 4,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: 'Hora de Registro' } },
                    y: { title: { display: true, text: 'Valor' }, beginAtZero: true }
                }
            }
        });

        // Función que consume la API en la nube
        async function fetchDatos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error en la respuesta del servidor');
                
                const datos = await response.json();
                
                // Mapear tiempos y valores desde el JSON devuelto por el Backend
                const labels = datos.map(item => {
                    const fecha = new Date(item.fecha_registro);
                    return fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                });
                const valores = datos.map(item => item.sensor_valor);

                // Inyectar datos al gráfico de Chart.js
                sensorChart.data.labels = labels;
                sensorChart.data.datasets[0].data = valores;
                sensorChart.update();

                document.getElementById('status-text').innerText = "Online (Actualizado)";
                document.getElementById('status-text').style.color = "#28a745";
            } catch (error) {
                console.error("Error al obtener datos:", error);
                document.getElementById('status-text').innerText = "Error de Conexión";
                document.getElementById('status-text').style.color = "#dc3545";
            }
        }

        // Consultar nuevos datos automáticamente cada 4 segundos
        setInterval(fetchDatos, 4000);
        fetchDatos(); // Carga inicial al abrir la página
    </script>
</body>
</html>
